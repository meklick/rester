name: Monthly Poem Rotation

on:
  schedule:
    # 09:00 JST on the first day of every month.
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: "Internal retry number after a failed public-domain check (0-2)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-poem-rotation
  cancel-in-progress: false

jobs:
  replace-and-pr:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select and validate a replacement poem set
        env:
          ROTATION_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.retry_attempt || '0' }}
        run: |
          set -uo pipefail

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Selecting replacement set: attempt ${attempt}/${max_attempts}"
            git restore --source=HEAD -- app/src/data/poems.json

            if ROTATION_ATTEMPT="$(( ROTATION_ATTEMPT + attempt - 1 ))" node scripts/rotate-aozora-poems.mjs && node scripts/validate-poems.mjs; then
              echo "Replacement set passed validation on attempt ${attempt}."
              exit 0
            fi

            echo "Replacement set failed validation on attempt ${attempt}. Retrying the full replacement."
          done

          git restore --source=HEAD -- app/src/data/poems.json
          echo "Failed to generate a valid replacement set after ${max_attempts} attempts."
          exit 1

      - name: Create branch, commit, and open PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          retry_attempt="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.retry_attempt || '0' }}"
          month="$(date -u +%Y-%m)"
          count="$(jq 'length' app/src/data/poems.json)"

          branch="auto/replace-poems-r${retry_attempt}-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git add app/src/data/poems.json
          git commit -m "feat: ${month}の詩を${count}件に入れ替え"
          git push -u origin "$branch"

          gh label create auto-generated --color "0e8a16" --description "Automated content generation" || true
          gh label create monthly-rotation --color "1d76db" --description "Monthly full poem-set replacement" || true
          gh pr create \
            --title "feat: ${month}の詩を月替わりで更新" \
            --body "## 月次の詩入れ替え\n\n- 件数: ${count}\n- 生成日時 (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)\n- 総入れ替えの試行: $((retry_attempt + 1))/3\n- 公開ドメイン確認: PR上で自動実行\n\n_This PR was auto-generated by GitHub Actions._" \
            --label auto-generated \
            --label monthly-rotation
